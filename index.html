  paintRibbon(-angle);
  paintRing(lowerRing, 270, -5, 1.4);
  requestAnimationFrame(draw);
}
function paintRing(labels, radius, curvature, height) {
  labels.forEach((label, index) => {
    const theta = angle * Math.PI / 180 + index * 2 * Math.PI / labels.length;
    const depth = Math.cos(theta);
    label.style.visibility = depth > 0 ? 'visible' : 'hidden';
    label.style.zIndex = Math.round(depth * 100);
    const x = Math.sin(theta) * radius;
    const y = (1 - depth) * curvature;
    const tilt = Math.atan2(curvature * Math.sin(theta), radius * Math.max(.22, depth));
    label.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${tilt}rad) scale(${Math.max(0, depth)},${height})`;
  });
}
function spin(amount) {
  target += amount;
  resumeAt = performance.now() + 1800;
}
draw(performance.now());
const sky = find('#sky');
function isOnSubject(event) {
  if (event.target.closest('header,footer')) return false;
  const bounds = find('.scene').getBoundingClientRect();
  const x = (event.clientX - bounds.left) * 580 / bounds.width;
  const y = (event.clientY - bounds.top) * 830 / bounds.height;
  const distance = Math.abs(x - 290);
  if (y < 0 || y > 830) return false;
  if (y < 150) return distance <= 200 && y >= 30;
  if (y < 296) return distance <= 20 + (y - 150) * .25;
  if (y < 384) return distance <= 200;
  if (y < 645) return distance <= (y >= 440 ? 252 : 230);
  if (y < 721) return distance <= 280;
  if (y < 782) return distance <= 276 * Math.sqrt(Math.max(0, 1 - ((y - 721) / 61) ** 2));
  return distance <= 87;
}
sky.addEventListener('wheel', event => {
  if (panel.open || transitioning || event.ctrlKey || !isOnSubject(event)) return;
  event.preventDefault();
  const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
  spin((event.deltaY || event.deltaX) * units * .22);
}, {passive:false});
let pointer;
let suppressClick = false;
sky.addEventListener('pointerdown', event => {
  if (panel.open || transitioning || event.button !== 0 ||
      event.target.closest('header,footer,#contact') || !isOnSubject(event)) return;
  suppressClick = false;
  pointer = {id:event.pointerId,x:event.clientX,y:event.clientY,total:0};
});
sky.addEventListener('pointermove', event => {
  if (pointer?.id !== event.pointerId) return;
  const distance = event.clientX-pointer.x || event.clientY-pointer.y;
  pointer.total += Math.abs(distance);
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  if (!isOnSubject(event)) return;
  if (pointer.total > 7) { suppressClick = true; spin(distance*.52); }
});
for (const name of ['pointerup','pointercancel']) window.addEventListener(name, () => { pointer = undefined; });
sky.addEventListener('click', event => {
  if (suppressClick && event.detail) { event.stopPropagation(); suppressClick = false; }
}, true);
window.addEventListener('keydown', event => {
  if (panel.open) return;
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') spin(-45);
  if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') spin(45);
});
function resize() {
  const scale = innerWidth < 640 ? Math.min(innerWidth / 595, innerHeight / 720) : Math.min(innerWidth / 1280, innerHeight / 956);
  find('.scene').style.setProperty('--scale', scale);
  find('#sky').style.setProperty('--plate-scale', scale);
}
window.addEventListener('resize', resize);
resize();
let seed = 312;
function random() { seed = (seed*16807)%2147483647; return seed/2147483647; }
for(let index=0;index<160;index++) {
  const star = element('i','');
  const size = index%12===0 ? 3.2 : 1;
  Object.assign(star.style,{left:random()*100+'%',top:random()*88+'%',width:size+'px',height:size+'px',opacity:.26+random()*.72});
  find('.stars').append(star);
}
function setTime() {
  const time = new Intl.DateTimeFormat('en-US',{timeZone:content.timeZone,hour:'numeric',minute:'2-digit'}).format(new Date());
  find('#clock').replaceChildren(element('div',content.city+' · '+time),element('span',content.status));
}
setTime();
setInterval(setTime,15000);
find('#glow').onclick = event => event.currentTarget.setAttribute('aria-pressed', sky.classList.toggle('flash'));
const music = new Audio('audio/memory.mp3');
music.loop = true;
music.preload = 'none';
let soundOn = false;
find('#sound').onclick = async event => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    if (soundOn) {
      music.pause();
      soundOn = false;
    } else {
      await music.play();
      soundOn = true;
    }
    button.setAttribute('aria-pressed', soundOn);
    button.setAttribute('aria-label', soundOn ? '暂停背景音乐' : '播放背景音乐');
    button.title = soundOn ? '暂停背景音乐' : '播放背景音乐';
    button.textContent = soundOn ? '♫' : '♫̸';
  } catch {
    soundOn = false;
    button.setAttribute('aria-pressed', 'false');
    button.setAttribute('aria-label', '音乐播放失败，点击重试');
    button.title = '音乐播放失败，点击重试';
    button.textContent = '♫̸';
  } finally {
    button.disabled = false;
  }
};
</script>
